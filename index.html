<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<title>「支払期限日・供給停止日」計算</title>
<!-- 日本の祝日判定ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/japanese-holidays@1.0.10/lib/japanese-holidays.min.js"></script>
<style>
  /* 縦スクロールバーを常に表示し、画面の横ブレを防ぐ */
  html { overflow-y: scroll; }

  body { font-family: sans-serif; background: #f4f7f6; padding: 20px; max-width: 800px; margin: auto; color: #333; display: flex; flex-direction: column; min-height: 95vh; box-sizing: border-box; }

  /* ヘッダーとクリアボタン */
  .header-container { display: flex; justify-content: space-between; align-items: center; position: relative; margin-bottom: 25px; margin-top: 10px; }
  .header-container h2 { margin: 0; text-align: left; flex: 1; }
  .clear-btn { padding: 8px 15px; background: #ddd; color: #333; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-family: inherit; transition: 0.2s; }
  .clear-btn:hover { background: #ccc; }

  /* スマホではタイトルとクリアボタンを縦に並べ、重なりを防止 */
  @media (max-width: 480px) {
    body { padding: 14px; }
    .header-container {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .header-container h2 {
      font-size: 20px;
      line-height: 1.4;
    }
    .clear-btn {
      align-self: flex-end;
    }
    .panel { padding: 20px 15px; }
  }

  .panel { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

  /* 入力エリア */
  .input-row { display: flex; gap: 20px; margin-bottom: 25px; }
  .input-box { flex: 1; }
  label.title { display: block; font-weight: bold; margin-bottom: 8px; font-size: 15px; color: #2c3e50; }

  input[type="date"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; font-family: inherit; transition: 0.2s; }
  input[type="date"]:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }

  /* 定義・説明ボックス（統一デザイン） */
  .info-box { background: #f9f9f9; border: 1px solid #eee; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
  .info-box-title { font-weight: bold; font-size: 15px; margin-bottom: 12px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 8px; }
  .info-box-content { font-size: 14px; color: #444; line-height: 1.6; }
  .info-box-content ul { margin: 0; padding-left: 20px; }
  .info-box-content li { margin-bottom: 6px; }
  .info-box-content li:last-child { margin-bottom: 0; }

  /* 結果表示エリア */
  .result-box { display: none; margin-top: 25px; }
  .result-box.active { display: block; }

  .result-grid { display: flex; flex-direction: column; gap: 15px; }
  .result-item { background: #fff; border: 1px solid #ddd; border-left: 6px solid #3498db; padding: 15px 20px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
  .result-item.grace { border-left-color: #f39c12; }
  .result-item.stop { border-left-color: #e74c3c; }

  .result-label { font-size: 14px; color: #555; font-weight: bold; margin-bottom: 5px; }
  .result-value { font-size: 24px; font-weight: bold; color: #333; }
  .result-sub { font-size: 13px; color: #e67e22; margin-top: 8px; font-weight: bold; }
  .result-sub.normal { color: #777; font-weight: normal; }
</style>
</head>
<body>

<div class="header-container">
  <h2>「支払期限日・供給停止日」計算</h2>
  <button class="clear-btn" onclick="clearSettings()">クリア</button>
</div>

<div class="panel">

  <!-- 入力エリア -->
  <div class="input-row">
    <div class="input-box">
      <label class="title">支払義務発生日（起算日）</label>
      <input type="date" id="start-date" oninput="calculateDates()" onchange="calculateDates()">
    </div>
  </div>
  <div id="result-area" class="result-box">
    <div class="result-grid">

      <!-- 支払期限日 -->
      <div class="result-item">
        <div class="result-label">支払期限日（30日後）</div>
        <div class="result-value" id="res-pay-limit"></div>
        <div class="result-sub" id="sub-pay-limit"></div>
      </div>

      <!-- 延滞利息猶予期限日 -->
      <div class="result-item grace">
        <div class="result-label">延滞利息猶予期限日（支払期限日から10日後）</div>
        <div class="result-value" id="res-grace"></div>
        <div class="result-sub normal">※休日延伸なし</div>
      </div>

      <!-- 供給停止日 -->
      <div class="result-item stop">
        <div class="result-label">供給停止日（50日後）</div>
        <div class="result-value" id="res-stop"></div>
        <div class="result-sub" id="sub-stop"></div>
      </div>

    </div>
  </div>

  <!-- 各日付の定義 -->
  <div class="info-box">
    <div class="info-box-title">各日付の定義</div>
    <div class="info-box-content">
      <ul>
        <li><strong>支払期限日</strong>：支払義務発生日の翌日から起算して30日後 <span style="color:#e67e22;">（休日延伸あり）</span></li>
        <li><strong>延滞利息猶予期限日</strong>：支払期限日の翌日から起算して10日後 <span style="color:#777;">（休日延伸なし）</span></li>
        <li><strong>供給停止日</strong>：支払義務発生日の翌日から起算して50日後 <span style="color:#e67e22;">（休日延伸あり）</span></li>
      </ul>
    </div>
  </div>

  <!-- 休日の定義 -->
  <div class="info-box">
    <div class="info-box-title">休日の定義（休日延伸の対象日）</div>
    <div class="info-box-content">
      銀行法第15条第1項に規定する政令で定める日（土曜日、日曜日、国民の祝日、1/2、1/3、12/31）と<br>
      1/4、5/1、12/29、12/30
    </div>
  </div>

</div>

<script>
// ================= クリア処理 =================
function clearSettings() {
  document.getElementById('start-date').value = '';
  document.getElementById('result-area').classList.remove('active');
}

// ================= 日付計算ロジック =================
function calculateDates() {
  const startDateStr = document.getElementById('start-date').value;
  const resultArea = document.getElementById('result-area');

  // 未入力の場合は結果を非表示にして終了
  if (!startDateStr) {
    resultArea.classList.remove('active');
    return;
  }

  const startDate = new Date(startDateStr);

  // --- 1. 支払期限日（30日後・休日延伸あり） ---
  let basePayDate = new Date(startDate);
  basePayDate.setDate(basePayDate.getDate() + 30);
  let payExtendInfo = getExtendedDateInfo(basePayDate);
  let finalPayDate = payExtendInfo.date;

  // --- 2. 延滞利息猶予期限日（支払期限日 + 10日・休日延伸なし） ---
  let graceDate = new Date(finalPayDate);
  graceDate.setDate(graceDate.getDate() + 10);

  // --- 3. 供給停止日（起算日 + 50日・休日延伸あり） ---
  let baseStopDate = new Date(startDate);
  baseStopDate.setDate(baseStopDate.getDate() + 50);
  let stopExtendInfo = getExtendedDateInfo(baseStopDate);
  let finalStopDate = stopExtendInfo.date;

  // --- 画面描画 ---
  document.getElementById('res-pay-limit').innerText = formatDate(finalPayDate);
  setExtendMessage('sub-pay-limit', basePayDate, payExtendInfo.extendCount);

  document.getElementById('res-grace').innerText = formatDate(graceDate);

  document.getElementById('res-stop').innerText = formatDate(finalStopDate);
  setExtendMessage('sub-stop', baseStopDate, stopExtendInfo.extendCount);

  resultArea.classList.add('active');
}

// 休日延伸処理を行い、最終日付と延伸日数を返す関数
function getExtendedDateInfo(baseDate) {
  let targetDate = new Date(baseDate);
  let extendCount = 0;

  while (true) {
    const holidayInfo = checkHoliday(targetDate);
    if (holidayInfo.isHoliday) {
      extendCount++;
      targetDate.setDate(targetDate.getDate() + 1); // 翌日に進める
    } else {
      break; // 休日でない日になったら抜ける
    }
  }
  return { date: targetDate, extendCount: extendCount };
}

// 延伸メッセージをセットする関数
function setExtendMessage(elementId, originalDate, extendCount) {
  const el = document.getElementById(elementId);
  if (extendCount > 0) {
    const originalDateStr = formatDate(originalDate);
    el.innerText = `※算出日「${originalDateStr}」が休日に該当するため、${extendCount}日延伸されました。`;
  } else {
    el.innerText = '';
  }
}

// ================= 休日判定処理 =================
function checkHoliday(date) {
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = date.getDay();

  // 1. 土日判定
  if (w === 0) return { isHoliday: true, name: '日曜日' };
  if (w === 6) return { isHoliday: true, name: '土曜日' };

  // 2. 祝日判定 (japanese-holidaysライブラリを使用)
  const holidayName = JapaneseHolidays.isHoliday(date);
  if (holidayName) return { isHoliday: true, name: holidayName };

  // 3. 固定休日判定 (銀行法に基づく休日 + 1/4, 5/1, 12/29, 12/30)
  if (m === 1 && d === 2) return { isHoliday: true, name: '1月2日' };
  if (m === 1 && d === 3) return { isHoliday: true, name: '1月3日' };
  if (m === 1 && d === 4) return { isHoliday: true, name: '1月4日' };
  if (m === 5 && d === 1) return { isHoliday: true, name: '5月1日' };
  if (m === 12 && d === 29) return { isHoliday: true, name: '12月29日' };
  if (m === 12 && d === 30) return { isHoliday: true, name: '12月30日' };
  if (m === 12 && d === 31) return { isHoliday: true, name: '12月31日' };

  return { isHoliday: false, name: null };
}

// ================= 日付フォーマット =================
function formatDate(date) {
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = ['日', '月', '火', '水', '木', '金', '土'][date.getDay()];
  return `${y}年${m}月${d}日(${w})`;
}
</script>
</body>
</html>
